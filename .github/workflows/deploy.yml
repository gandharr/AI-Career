name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Diagnostics
        working-directory: frontend
        run: |
          echo "=== Diagnostic: node/npm versions and environment ==="
          node --version || true
          npm --version || true
          echo "--- pwd ---"
          pwd
          echo "--- ls -la frontend ---"
          ls -la
          echo "--- npm config list ---"
          npm config list || true
          echo "=== End diagnostics ==="

      - name: Install dependencies
        working-directory: frontend
        run: |
          # Use a simple, compatible install in CI. 'npm ci' is deterministic and
          # installs devDependencies when NODE_ENV is not 'production'. This avoids
          # inconsistent CLI flags across npm versions on runners.
          npm ci

      - name: Validate VITE_API_URL
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Warning: VITE_API_URL secret is missing. Frontend will use production fallback URL from source code."
          elif [[ "$VITE_API_URL" == *"api.render.com"* ]] || [[ "$VITE_API_URL" == *"?key="* ]]; then
            echo "Warning: VITE_API_URL appears invalid (Render control API or contains key). Frontend will use production fallback URL from source code."
          fi

      - name: Build
        working-directory: frontend
        env:
          # Set in GitHub → Settings → Secrets → Actions → New repository secret
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
